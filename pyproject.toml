[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ventura.gold"
version = "1.0.0"
description = "Agente de repositorio automatizado — 100% Python, local-first, MCP e integracao LLM opcional"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Ventura Labs AI"}]
keywords = ["ai-agents", "llm", "agent-framework", "local-first", "portable", "mcp", "repository"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "typer>=0.12.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
tokens = ["tiktoken>=0.7.0"]

[project.scripts]
ventura-gold = "ventura_gold.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ventura_gold = ["agents/*.md", "agents/*.json", "skills/**/*.md", "skills/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
