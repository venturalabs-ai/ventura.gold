name: Package Export

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Export portable package
        run: ventura-gold export

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ventura-agent-package
          path: dist/ventura-agent-package.json
          if-no-files-found: error
