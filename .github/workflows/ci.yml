name: CI — ventura.gold

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest tests/ -v

      - name: Doctor
        run: ventura-gold doctor

      - name: Repo scan
        run: ventura-gold repo scan

      - name: Validate
        run: ventura-gold validate

      - name: Export
        run: ventura-gold export

      - name: Secret pattern scan
        run: |
          if grep -rE "(sk-ant-[A-Za-z0-9_-]{10,}|sk-proj-[A-Za-z0-9_-]{10,}|ghp_[A-Za-z0-9]{20,}|xai-[A-Za-z0-9]{20,})" --include="*.py" --include="*.md" --include="*.json" . ; then
            echo "❌ POSSÍVEL SEGREDO DETECTADO"
            exit 1
          fi
          echo "✅ Sem padrões de segredo óbvios"
