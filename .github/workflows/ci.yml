name: CI — ventura.gold

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest tests/ -v

      - name: Doctor
        run: ventura-gold doctor

      - name: Validate
        run: ventura-gold validate

      - name: Repo scan
        run: ventura-gold repo scan

      - name: Export
        run: ventura-gold export

      - name: Secret scan (basic)
        run: |
          if grep -rE '(sk-[a-zA-Z0-9]{20,})' --include='*.py' --include='*.md' --include='*.json' . ; then
            echo 'POSSIVEL SEGREDO DETECTADO'
            exit 1
          fi
          echo 'OK sem padroes obvios de segredo'
